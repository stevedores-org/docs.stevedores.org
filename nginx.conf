upstream llama_rs {
    server llama-rs-docs:80;
}

upstream oxidized_mlx {
    server oxidized-mlx-docs:80;
}

upstream oxidized_rag {
    server oxidized-rag-docs:80;
}

upstream oxidized_graph {
    server oxidized-graph-docs:80;
}

server {
    listen 80;
    server_name docs.stevedores.org;

    # llama.rs docs
    location /llama-rs/ {
        proxy_pass http://llama_rs/llama-rs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # oxidizedMLX docs
    location /oxidizedMLX/ {
        proxy_pass http://oxidized_mlx/oxidizedMLX/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # oxidizedRAG docs
    location /oxidizedRAG/ {
        proxy_pass http://oxidized_rag/oxidizedRAG/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # oxidizedgraph docs
    location /oxidizedgraph/ {
        proxy_pass http://oxidized_graph/oxidizedgraph/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Root redirect to stevedores.org
    location = / {
        return 301 https://stevedores.org;
    }

    # Catch-all: show available docs
    location / {
        default_type text/html;
        return 200 '<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>docs.stevedores.org</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #09090b; color: #a1a1aa; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .container { max-width: 480px; text-align: center; }
    h1 { color: #fafafa; font-size: 1.5rem; margin-bottom: 2rem; }
    a { color: #a78bfa; text-decoration: none; display: block; padding: 0.75rem 1.5rem; margin: 0.5rem 0; border: 1px solid #27272a; border-radius: 0.5rem; transition: all 0.2s; }
    a:hover { border-color: #a78bfa; background: rgba(167,139,250,0.06); }
  </style>
</head>
<body>
  <div class="container">
    <h1>docs.stevedores.org</h1>
    <a href="/llama-rs/">llama.rs</a>
    <a href="/oxidizedMLX/">oxidizedMLX</a>
    <a href="/oxidizedRAG/">oxidizedRAG</a>
    <a href="/oxidizedgraph/">oxidizedgraph</a>
  </div>
</body>
</html>';
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
