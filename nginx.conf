# ─── Existing repos ─────────────────────────────────────────────────────────
upstream llama_rs {
    server llama-rs-docs:80;
}

upstream oxidized_mlx {
    server oxidized-mlx-docs:80;
}

upstream oxidized_rag {
    server oxidized-rag-docs:80;
}

upstream oxidized_graph {
    server oxidized-graph-docs:80;
}

# ─── New repos ──────────────────────────────────────────────────────────────
upstream aivcs {
    server aivcs-docs:80;
}

upstream crossplane_heaven {
    server crossplane-heaven-docs:80;
}

upstream data_fabric {
    server data-fabric-docs:80;
}

upstream devprod_ai {
    server devprod-ai-docs:80;
}

upstream gitoxide {
    server gitoxide-docs:80;
}

upstream knittingcrab {
    server knittingcrab-docs:80;
}

upstream libgit2 {
    server libgit2-docs:80;
}

upstream llama_cpp {
    server llama-cpp-docs:80;
}

upstream local_ci {
    server local-ci-docs:80;
}

upstream mlx {
    server mlx-docs:80;
}

upstream nix_cache {
    server nix-cache-docs:80;
}

upstream stevedores_org {
    server stevedores-org-docs:80;
}

upstream ai_agent_agent_guides {
    server ai-agent-agent-guides-docs:80;
}

upstream ai_agent_ci {
    server ai-agent-ci-docs:80;
}

upstream ai_agent_docs {
    server ai-agent-docs-docs:80;
}

server {
    listen 80;
    server_name docs.stevedores.org;

    # ─── Existing repos ─────────────────────────────────────────────────────

    # llama.rs docs
    location /llama-rs/ {
        proxy_pass http://llama_rs/llama-rs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # oxidizedMLX docs
    location /oxidizedMLX/ {
        proxy_pass http://oxidized_mlx/oxidizedMLX/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # oxidizedRAG docs
    location /oxidizedRAG/ {
        proxy_pass http://oxidized_rag/oxidizedRAG/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # oxidizedgraph docs
    location /oxidizedgraph/ {
        proxy_pass http://oxidized_graph/oxidizedgraph/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ─── New repos ──────────────────────────────────────────────────────────

    # aivcs docs
    location /aivcs/ {
        proxy_pass http://aivcs/aivcs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # crossplane-heaven docs
    location /crossplane-heaven/ {
        proxy_pass http://crossplane_heaven/crossplane-heaven/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # data-fabric docs
    location /data-fabric/ {
        proxy_pass http://data_fabric/data-fabric/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # DevProd-AI docs
    location /DevProd-AI/ {
        proxy_pass http://devprod_ai/DevProd-AI/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # gitoxide docs
    location /gitoxide/ {
        proxy_pass http://gitoxide/gitoxide/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # knittingCrab docs
    location /knittingCrab/ {
        proxy_pass http://knittingcrab/knittingCrab/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # libgit2 docs
    location /libgit2/ {
        proxy_pass http://libgit2/libgit2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # llama.cpp docs
    location /llama-cpp/ {
        proxy_pass http://llama_cpp/llama-cpp/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # local-ci docs
    location /local-ci/ {
        proxy_pass http://local_ci/local-ci/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # mlx docs
    location /mlx/ {
        proxy_pass http://mlx/mlx/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # nix-cache docs
    location /nix-cache/ {
        proxy_pass http://nix_cache/nix-cache/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # stevedores.org docs
    location /stevedores-org/ {
        proxy_pass http://stevedores_org/stevedores-org/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ai-agent-agent-guides docs
    location /ai-agent-agent-guides/ {
        proxy_pass http://ai_agent_agent_guides/ai-agent-agent-guides/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ai-agent-ci docs
    location /ai-agent-ci/ {
        proxy_pass http://ai_agent_ci/ai-agent-ci/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ai-agent-docs docs
    location /ai-agent-docs/ {
        proxy_pass http://ai_agent_docs/ai-agent-docs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Root redirect to stevedores.org
    location = / {
        return 301 https://stevedores.org;
    }

    # Catch-all: show available docs
    location / {
        default_type text/html;
        return 200 '<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>docs.stevedores.org</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #09090b; color: #a1a1aa; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .container { max-width: 480px; text-align: center; }
    h1 { color: #fafafa; font-size: 1.5rem; margin-bottom: 2rem; }
    h2 { color: #71717a; font-size: 0.875rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; margin: 1.5rem 0 0.5rem; }
    a { color: #a78bfa; text-decoration: none; display: block; padding: 0.75rem 1.5rem; margin: 0.5rem 0; border: 1px solid #27272a; border-radius: 0.5rem; transition: all 0.2s; }
    a:hover { border-color: #a78bfa; background: rgba(167,139,250,0.06); }
  </style>
</head>
<body>
  <div class="container">
    <h1>docs.stevedores.org</h1>
    <h2>ML &amp; Inference</h2>
    <a href="/llama-rs/">llama.rs</a>
    <a href="/llama-cpp/">llama.cpp</a>
    <a href="/oxidizedMLX/">oxidizedMLX</a>
    <a href="/mlx/">mlx</a>
    <h2>Data &amp; RAG</h2>
    <a href="/oxidizedRAG/">oxidizedRAG</a>
    <a href="/data-fabric/">data-fabric</a>
    <h2>Agents &amp; Orchestration</h2>
    <a href="/oxidizedgraph/">oxidizedgraph</a>
    <a href="/ai-agent-agent-guides/">ai-agent-agent-guides</a>
    <a href="/ai-agent-ci/">ai-agent-ci</a>
    <a href="/ai-agent-docs/">ai-agent-docs</a>
    <h2>Developer Tools</h2>
    <a href="/aivcs/">aivcs</a>
    <a href="/local-ci/">local-ci</a>
    <a href="/gitoxide/">gitoxide</a>
    <a href="/libgit2/">libgit2</a>
    <a href="/nix-cache/">nix-cache</a>
    <h2>Infrastructure</h2>
    <a href="/crossplane-heaven/">crossplane-heaven</a>
    <a href="/DevProd-AI/">DevProd-AI</a>
    <a href="/knittingCrab/">knittingCrab</a>
    <a href="/stevedores-org/">stevedores.org</a>
  </div>
</body>
</html>';
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
