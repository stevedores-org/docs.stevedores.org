    build:
      context: https://github.com/stevedores-org/oxidizedgraph.git#main:docs-site
    expose:
      - "80"
    restart: unless-stopped

  # ─── New repos ──────────────────────────────────────────────────────────

  # aivcs docs
  aivcs-docs:
    build:
      context: https://github.com/stevedores-org/aivcs.git#main:docs-site
    expose:
      - "80"
    restart: unless-stopped

