services:
  # Reverse proxy
  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - llama-rs-docs
      - oxidized-mlx-docs
      - oxidized-rag-docs
      - oxidized-graph-docs
      - aivcs-docs
      - crossplane-heaven-docs
      - data-fabric-docs
      - devprod-ai-docs
      - gitoxide-docs
      - knittingcrab-docs
      - libgit2-docs
      - llama-cpp-docs
      - local-ci-docs
      - mlx-docs
      - nix-cache-docs
      - stevedores-org-docs
      - ai-agent-agent-guides-docs
      - ai-agent-ci-docs
      - ai-agent-docs-docs
    restart: unless-stopped

  # ─── Existing repos ─────────────────────────────────────────────────────

  # llama.rs docs
  llama-rs-docs:
    build:
      context: https://github.com/stevedores-org/llama.rs.git#main:docs-site
    expose:
      - "80"
    restart: unless-stopped

  # oxidizedMLX docs
  oxidized-mlx-docs:
    build:
      context: https://github.com/stevedores-org/oxidizedMLX.git#main:docs-site
    expose:
      - "80"
    restart: unless-stopped

  # oxidizedRAG docs
  oxidized-rag-docs:
    build:
      context: https://github.com/stevedores-org/oxidizedRAG.git#main:docs-site
    expose:
      - "80"
    restart: unless-stopped

  # oxidizedgraph docs
