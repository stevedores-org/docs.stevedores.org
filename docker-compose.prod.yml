services:
  # Reverse proxy
  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - llama-rs-docs
      - oxidized-mlx-docs
      - oxidized-rag-docs
      - oxidized-graph-docs
    restart: unless-stopped

  # llama.rs docs
  llama-rs-docs:
    build:
      context: https://github.com/stevedores-org/llama.rs.git#main:docs-site
    expose:
      - "80"
    restart: unless-stopped

  # oxidizedMLX docs
  oxidized-mlx-docs:
    build:
      context: https://github.com/stevedores-org/oxidizedMLX.git#main:docs-site
    expose:
      - "80"
    restart: unless-stopped

  # oxidizedRAG docs
  oxidized-rag-docs:
    build:
      context: https://github.com/stevedores-org/oxidizedRAG.git#main:docs-site
    expose:
      - "80"
    restart: unless-stopped

  # oxidizedgraph docs
  oxidized-graph-docs:
    build:
      context: https://github.com/stevedores-org/oxidizedgraph.git#main:docs-site
    expose:
      - "80"
    restart: unless-stopped
