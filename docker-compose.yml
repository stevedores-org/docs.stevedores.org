services:
  # Reverse proxy
  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - llama-rs-docs
      - oxidized-mlx-docs
      - oxidized-rag-docs
      - oxidized-graph-docs
    restart: unless-stopped

  # llama.rs docs
  llama-rs-docs:
    build:
      context: ../llama.rs/docs-site
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped

  # oxidizedMLX docs
  oxidized-mlx-docs:
    build:
      context: ../oxidizedMLX/docs-site
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped

  # oxidizedRAG docs
  oxidized-rag-docs:
    build:
      context: ../oxidizedRAG/docs-site
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped

  # oxidizedgraph docs
  oxidized-graph-docs:
    build:
      context: ../oxidizedgraph/docs-site
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped
