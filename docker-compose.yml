services:
  # Reverse proxy
  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - llama-rs-docs
      - oxidized-mlx-docs
      - oxidized-rag-docs
      - oxidized-graph-docs
      - aivcs-docs
      - crossplane-heaven-docs
      - data-fabric-docs
      - devprod-ai-docs
      - gitoxide-docs
      - knittingcrab-docs
      - libgit2-docs
      - llama-cpp-docs
      - local-ci-docs
      - mlx-docs
      - nix-cache-docs
      - stevedores-org-docs
      - ai-agent-agent-guides-docs
      - ai-agent-ci-docs
      - ai-agent-docs-docs
    restart: unless-stopped

  # ─── Existing repos ─────────────────────────────────────────────────────

  # llama.rs docs
  llama-rs-docs:
    build:
      context: ../llama.rs/docs-site
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped

  # oxidizedMLX docs
  oxidized-mlx-docs:
    build:
      context: ../oxidizedMLX/docs-site
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped

